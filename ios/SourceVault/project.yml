# Source of truth for SourceVault.xcodeproj (spec v0.5 §22.3, F2-D2: the
# vault's own iOS app). After adding or moving files, run:
#   xcodegen generate
name: SourceVault
options:
  bundleIdPrefix: com.racker
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: 9RGW34CMA2
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    # The engine is built for arm64 only (devices and Apple-silicon
    # simulators).
    ARCHS: arm64
targets:
  SourceVault:
    type: application
    platform: iOS
    sources:
      - path: SourceVault
      # The §2.12 bridge, the same file the Mac helper links (§22.2).
      - path: ../../src-tauri/vault-apple-crypto/Sources/VaultAppleCrypto/Bridge.swift
    preBuildScripts:
      - name: Build the vault engine (vault-ffi)
        script: "\"${PROJECT_DIR}/scripts/build-rust.sh\""
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.racker.source-vault
        PRODUCT_NAME: SourceVault
        INFOPLIST_FILE: SourceVault/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: SourceVault/SourceVault.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: SourceVault/VaultFFI.h
        LIBRARY_SEARCH_PATHS: "$(PROJECT_DIR)/build/rust/$(PLATFORM_NAME)"
        OTHER_LDFLAGS: "-lvault_ffi"
        # Never a debug engine in a release app (VER-O8): the scripts build
        # the matching profile.
        ENABLE_BITCODE: NO
    scheme:
      testTargets:
        - SourceVaultTests
        - SourceVaultXV
  # Unit tests (simulator): xcodebuild test -scheme SourceVault
  #   -destination 'platform=iOS Simulator,name=iPhone 17'
  SourceVaultTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SourceVaultTests
    dependencies:
      - target: SourceVault
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.racker.source-vault.tests
        GENERATE_INFOPLIST_FILE: YES
  # The CryptoKit-only cross-check (spec v0.5 §22.2): links neither the
  # engine nor the app; reads the committed XV vectors as resources.
  SourceVaultXV:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SourceVaultXV
      - path: ../../src-tauri/vault-helper/tests/vectors/xv_tlv.json
        buildPhase: resources
      - path: ../../src-tauri/vault-helper/tests/vectors/xv_ecdsa.json
        buildPhase: resources
      - path: ../../src-tauri/vault-helper/tests/vectors/xv_enroll.json
        buildPhase: resources
      - path: ../../src-tauri/vault-helper/tests/vectors/xv_peer.json
        buildPhase: resources
      - path: ../../src-tauri/poc/hpke-se/vectors/rfc9180-p256-sha256-chacha20poly1305.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.racker.source-vault.xv
        GENERATE_INFOPLIST_FILE: YES
