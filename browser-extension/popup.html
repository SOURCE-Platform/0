<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Source Vault</title>
    <style>
      body { font: 13px -apple-system, system-ui, sans-serif; width: 300px; margin: 12px; color: #1c1917; }
      h1 { font-size: 14px; margin: 0 0 8px; }
      .account { border: 1px solid #e7e5e4; border-radius: 8px; padding: 8px; margin: 6px 0; }
      .row { display: flex; gap: 6px; margin-top: 6px; }
      button { cursor: pointer; border: 1px solid #d6d3d1; background: #fff; border-radius: 6px; padding: 4px 8px; }
      .note { color: #57534e; margin-top: 8px; }
      .warn { background: #fef3c7; border: 1px solid #f59e0b; border-radius: 8px; padding: 8px; color: #78350f; }
    </style>
  </head>
  <body>
    <h1>Source Vault</h1>
    <div id="list"></div>
    <div id="note" class="note"></div>
    <script src="popup.js"></script>
  </body>
</html>
