[package]
name = "vault-engine"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "The platform-neutral vault engine (spec v0.5 §22.2, F2-D1): storage, sync, peer, crypto, registry, recovery and the op logic, shared by the macOS helper and the SOURCE Vault iPhone app"
publish = false

# Dependency policy (spec §15.4 / §17.4): moved unchanged from
# vault-helper (Phase F.2b step 1); no crate added. Every dependency lands
# in scripts/audit-deps.sh output and needs a cargo-vet audit.

[dependencies]
vault-proto = { path = "../vault-proto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
core-foundation = "0.10"
argon2 = "0.6"
chacha20poly1305 = "0.11"
hkdf = "0.13"
hmac = "0.13"
sha2 = "0.11"
zeroize = { version = "1", features = ["derive"] }
secrecy = "0.10"
subtle = "2"
p256 = { version = "0.14", features = ["ecdsa"] }
unicode-normalization = "0.1"
getrandom = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
# Phase I: Dashlane ZIP members (deflate). Already in Cargo.lock and
# exempted in supply-chain/config.toml; adds flate2, miniz_oxide,
# crc32fast, adler2, simd-adler32 to the helper graph.
# The pure-Rust backend only, pinned (final review: the review note for
# flate2 relies on the C-zlib backends never being compiled;
# scripts/audit-deps.sh fails if a zlib feature appears).
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
# The member CRC check (final review SPEC-I6 #5); already in the graph via flate2.
crc32fast = "1.4"

[dev-dependencies]
serde_json = { version = "1", features = ["preserve_order"] }

[lib]
name = "vault_engine"
path = "src/lib.rs"
