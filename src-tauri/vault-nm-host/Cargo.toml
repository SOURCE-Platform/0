[package]
name = "vault-nm-host"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "The Chrome native-messaging broker for the vault (spec §9.2, §17.2): frame checks and relay only"
publish = false

# §17.2: serde/serde_json only (plus std). The helper's code identity is
# checked through the system Security framework directly, with no crate
# (owner decision 2026-10-17, final review VER-I12).
[dependencies]
serde_json = "1"

[lib]
name = "vault_nm_host"
path = "src/lib.rs"

[[bin]]
name = "source-vault-nm-host"
path = "src/bin/source-vault-nm-host.rs"
