[package]
name = "source-vault-helper"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Phase A vault helper skeleton: code-authenticated IPC boundary with no secrets"
publish = false

# Dependency policy (spec §15.4 / §17.4): this crate must stay minimal.
# Every dependency added here lands in scripts/audit-deps.sh output and
# requires a cargo-vet audit. Do not add crates without a spec citation.

[dependencies]
# Phase F (spec v0.4 §1.1): wire types and secret-free verification,
# shared with the provider; a workspace path crate, no new external deps.
vault-proto = { path = "../vault-proto" }
# F.2b: the platform-neutral engine (moved out of this crate unchanged).
vault-engine = { path = "../vault-engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
core-foundation = "0.10"
# Phase B crypto, Phase C storage and the rest of the vault moved to
# `vault-engine` with F.2b; the shell keeps only what its own code uses:
# argon2 (the kdf_bench gate tool) and zeroize (the secure panel).
argon2 = "0.6"
zeroize = { version = "1", features = ["derive"] }
# Phase C (spec §17.1): the objc2 family for the LA presence checks and the
# §1.7 native secure panel (objc2-app-kit and objc2-local-authentication
# are the same project's framework crates — §17.1 lists the family; the
# specific framework crates are recorded as reviewed in
# supply-chain/audits.toml). Keychain (§2.8) stays hand-rolled
# Security.framework FFI like Phase A's SecCode checks — no crate.
objc2 = "0.5"
# objc2 framework crates gate every class behind a cargo feature; enable
# exactly the classes the panel/LA/notify code touches (§17.4 minimal
# surface rule).
objc2-foundation = { version = "0.2", features = [
    "NSString",
    "NSError",
    "NSNotification",
    "NSDistributedNotificationCenter",
    "NSOperation",
    "NSRunLoop",
    "NSThread",
    "block2",
] }
objc2-app-kit = { version = "0.2", features = [
    "NSApplication",
    "NSButton",
    "NSControl",
    "NSGraphics",
    "NSResponder",
    "NSSecureTextField",
    "NSTextField",
    "NSView",
    "NSWindow",
    "NSWorkspace",
    "NSRunningApplication",
    "NSPrintOperation",
    "NSPrintInfo",
] }
objc2-local-authentication = { version = "0.2", features = ["LAContext", "block2"] }
block2 = "0.5"

[dev-dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
# Tests only (they inspect the engine's database and vectors directly).
hkdf = "0.13"
sha2 = "0.11"
rusqlite = { version = "0.32", features = ["bundled"] }

# Phase B gate tooling (never shipped in the bundle):
[[bin]]
name = "gen_vectors"
path = "src/bin/gen_vectors.rs"

[[bin]]
name = "kdf_bench"
path = "src/bin/kdf_bench.rs"

[lib]
name = "vault_helper"
path = "src/lib.rs"

[[bin]]
name = "source-vault-helper"
path = "src/main.rs"

# Development/gate binary: exercises the IPC client side and both
# SecCode checks against a real helper. Never shipped inside the app bundle.
[[bin]]
name = "vault-test-client"
path = "src/bin/vault-test-client.rs"

# Real AppKit panel + real socket: needs the process main thread, so it
# runs without the libtest harness (skips unless OV0_VAULT_APPKIT_TESTS=1).
[[test]]
name = "lock_preempts_panel"
path = "tests/lock_preempts_panel.rs"
harness = false
