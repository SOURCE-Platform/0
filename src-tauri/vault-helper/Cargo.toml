[package]
name = "source-vault-helper"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Phase A vault helper skeleton: code-authenticated IPC boundary with no secrets"
publish = false

# Dependency policy (spec §15.4 / §17.4): this crate must stay minimal.
# Every dependency added here lands in scripts/audit-deps.sh output and
# requires a cargo-vet audit. Do not add crates without a spec citation.

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
core-foundation = "0.10"
# Phase B cryptographic core (spec §17.1). Versions are the current
# RustCrypto releases; the spec's minor pins (argon2 0.5, chacha20poly1305
# 0.10, hkdf 0.12, p256 0.13) predate the digest-0.11 line that the main
# app's sha2 0.11 already uses. Same algorithms, same maintainers; each
# version choice is recorded in the Phase B verification report and vetted
# per §17.4. `hpke` is deliberately absent: envelope code is Phase E.
argon2 = "0.6"
chacha20poly1305 = "0.11"
hkdf = "0.13"
hmac = "0.13"
sha2 = "0.11"
zeroize = { version = "1", features = ["derive"] }
secrecy = "0.10"
subtle = "2"
p256 = { version = "0.14", features = ["ecdsa"] }
unicode-normalization = "0.1"
getrandom = "0.4"
# Phase C (spec §17.1): rusqlite/bundled per spec pin; objc2 family for the
# LA presence checks and the §1.7 native secure panel (objc2-app-kit and
# objc2-local-authentication are the same project's framework crates —
# §17.1 lists the family; the specific framework crates are recorded as
# reviewed in supply-chain/audits.toml). Keychain (§2.8) stays hand-rolled
# Security.framework FFI like Phase A's SecCode checks — no crate.
rusqlite = { version = "0.32", features = ["bundled"] }
objc2 = "0.5"
# objc2 framework crates gate every class behind a cargo feature; enable
# exactly the classes the panel/LA/notify code touches (§17.4 minimal
# surface rule).
objc2-foundation = { version = "0.2", features = [
    "NSString",
    "NSError",
    "NSNotification",
    "NSDistributedNotificationCenter",
    "NSOperation",
    "NSRunLoop",
    "NSThread",
    "block2",
] }
objc2-app-kit = { version = "0.2", features = [
    "NSApplication",
    "NSButton",
    "NSControl",
    "NSGraphics",
    "NSResponder",
    "NSSecureTextField",
    "NSTextField",
    "NSView",
    "NSWindow",
    "NSWorkspace",
    "NSRunningApplication",
    "NSPrintOperation",
    "NSPrintInfo",
] }
objc2-local-authentication = { version = "0.2", features = ["LAContext", "block2"] }
block2 = "0.5"

[dev-dependencies]
serde_json = { version = "1", features = ["preserve_order"] }

# Phase B gate tooling (never shipped in the bundle):
[[bin]]
name = "gen_vectors"
path = "src/bin/gen_vectors.rs"

[[bin]]
name = "kdf_bench"
path = "src/bin/kdf_bench.rs"

[lib]
name = "vault_helper"
path = "src/lib.rs"

[[bin]]
name = "source-vault-helper"
path = "src/main.rs"

# Development/gate binary: exercises the IPC client side and both
# SecCode checks against a real helper. Never shipped inside the app bundle.
[[bin]]
name = "vault-test-client"
path = "src/bin/vault-test-client.rs"

# Real AppKit panel + real socket: needs the process main thread, so it
# runs without the libtest harness (skips unless OV0_VAULT_APPKIT_TESTS=1).
[[test]]
name = "lock_preempts_panel"
path = "tests/lock_preempts_panel.rs"
harness = false
