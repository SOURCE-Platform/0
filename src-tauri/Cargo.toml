[workspace]
members = ["vault-helper"]
resolver = "2"

[package]
name = "SOURCE"
version = "0.1.0"
description = "Cross-platform screen recording and activity tracking application"
authors = ["you"]
edition = "2021"
license = "GPL-3.0-only"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "zero_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2.4.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate"] }
libc = "0.2"
notify = { version = "8.2", default-features = false, features = ["macos_fsevent"] }
tauri-plugin-dialog = "2.4.0"
image = "0.25"
thiserror = "2.0"
async-trait = "0.1"
hostname = "0.4"
tesseract = "0.14"
leptonica-sys = "0.4"
regex = "1"
hound = "3"
cpal = "0.15"
# NOTE: ffmpeg-next 6.0 is incompatible with FFmpeg 8.0+ due to removed avfft.h
# Using ffmpeg-sys-next (low-level bindings) until ffmpeg-next 7.x is available
# ffmpeg-next = "6.0"
ffmpeg-sys-next = "8.0"
axum = { version = "0.8.9", features = ["ws", "multipart", "macros"] }
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
mdns-sd = "0.21.3"
sha2 = "0.11.0"
rand = "0.10.2"
rcgen = "0.14.10"
base64 = "0.23.1"
futures = "0.3.34"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }

[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = "0.2"
screencapturekit-sys = "0.2"
core-graphics = "0.23"
cocoa = "0.25"
objc = "0.2"
# The vault protocol client is shared with the helper crate (single source
# for framing, peer-auth requirements, and the op surface) instead of a
# drift-prone reimplementation. Runtime separation is unchanged: vault
# secrets still live only in the helper process.
source-vault-helper = { path = "vault-helper" } # lib name: vault_helper

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Gdi",
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_ProcessStatus",
    "Win32_UI_Input_KeyboardAndMouse",
] }

[target.'cfg(target_os = "linux")'.dependencies]
x11 = { version = "2.21", features = ["xlib", "xrandr"] }
ashpd = "0.9"
zbus = "4.0"
procfs = "0.16"
evdev = "0.12"
